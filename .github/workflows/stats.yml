name: 한국사 아카이브 — 조회수 통계 수집

on:
  schedule:
    # 매일 오전 5시 KST (= 20:00 UTC 전날) — 발행 워크플로우보다 1시간 앞
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: GoatCounter 통계 수집
        env:
          GOATCOUNTER_CODE:  ${{ secrets.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python scripts/fetch-stats.py 2>&1 | tee stats-report.txt

      - name: 인덱스 재생성 (조회수 반영)
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
        run: |
          python scripts/rebuild-index.py

      - name: 결과 요약
        if: always()
        run: |
          echo "### 조회수 통계 수집 결과" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat stats-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json content.html index.html llms.txt
          git diff --staged --quiet && echo "변경 없음" || \
            git commit -m "📊 통계 갱신: 조회수 업데이트 [skip ci]" && git push
