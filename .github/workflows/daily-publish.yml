name: 한국사 아카이브 — 매일 글 자동 발행

on:
  schedule:
    # 매일 오전 6시 KST (= 21:00 UTC 전날)
    - cron: '0 21 * * *'
  workflow_dispatch:
    # 수동 실행 버튼 (테스트용)

permissions:
  contents: write  # 파일 커밋·푸시 허용

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install anthropic

      - name: 글 자동 생성
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate-article.py

      - name: 커밋 & 푸시
        if: steps.generate.outputs.skipped != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ thoughts/
          git diff --staged --quiet && echo "변경사항 없음" && exit 0
          git commit -m "📝 자동 발행: ${{ steps.generate.outputs.title }}"
          git push
