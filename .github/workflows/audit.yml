name: 한국사 아카이브 — 품질 감사

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'thoughts/**'
      - 'era/**'
      - 'topics/**'
      - 'related/**'
      - 'region/**'
      - '_data/sources.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 품질 감사 실행
        id: audit
        run: |
          python scripts/audit.py 2>&1 | tee audit-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 감사 결과 요약 출력
        if: always()
        run: |
          echo "### 품질 감사 결과" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: sources.json used_in 자동 수정
        if: steps.audit.outputs.exit_code != '0'
        run: |
          python scripts/audit.py --fix
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/sources.json
          git diff --staged --quiet && echo "수정 없음" || \
            git commit -m "🔧 sources.json used_in 자동 정리 [skip ci]" && git push

      - name: 오류 시 실패 처리
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "❌ 품질 감사 실패 — 태그 인덱스 누락 또는 글 수 불일치 확인 필요"
          cat audit-report.txt
          exit 1
