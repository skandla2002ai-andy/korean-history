name: Rebuild Index Files

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'   # 글 파일이 변경(머지)될 때만 실행
      - 'thoughts/**'

permissions:
  contents: write

jobs:
  rebuild:
    # github-actions[bot] 자신의 커밋은 무시 (무한 루프 방지)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild index files
        run: python scripts/rebuild.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml data.json llms.txt llms-full.txt content.md changelog.md

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi

          git commit -m "🔄 인덱스 자동 재빌드 [skip ci]"
          git push
